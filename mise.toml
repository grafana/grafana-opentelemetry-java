[tools]
java = "temurin-25.0.1+8.0.LTS"
node = "26.13.1"

# Linters
actionlint = "1.7.12"
"aqua:grafana/flint" = "0.22.15"
"aqua:jonwiggins/xmloxide" = "0.5.0"
"aqua:owenlamont/ryl" = "0.29.0"
biome = "2.6.7"
editorconfig-checker = "4.0.2"
google-java-format = "2.0.0"
hadolint = "2.15.1"
ktlint = "1.8.0"
lychee = "0.24.2"
# @yarnpkg/libzip 3.2.2 is npm-signed and matches Yarn's release commit, but
# was published without provenance; mise's no-downgrade policy otherwise rejects Renovate.
"npm:renovate" = { version = "44.257.5", trust_policy_excludes = ["@yarnpkg/libzip@3.2.2"] }
rumdl = "v0.3.5"
shellcheck = "v0.11.0"
shfmt = "3.14.1"
taplo = "0.10.0"
typos = "1.52.2"

[env]
FLINT_CONFIG_DIR = ".github/config"

[tasks.build]
description = "Build the Java project"
run = "./gradlew build"

[tasks.lint]
description = "Run all lints"
run = "flint run"

[tasks."lint:fix"]
description = "Auto-fix lint issues"
run = "flint run --fix"

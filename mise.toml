[tools]
java = "temurin-25.0.1+8.0.LTS"
node = "24.21.0"

# Linters
actionlint = "1.7.12"
"aqua:grafana/flint" = "0.22.11"
"aqua:jonwiggins/xmloxide" = "0.5.0"
"aqua:owenlamont/ryl" = "0.22.0"
biome = "2.5.12"
editorconfig-checker = "4.0.1"
google-java-format = "1.36.1"
hadolint = "2.15.1"
ktlint = "1.8.0"
lychee = "0.24.2"
# @yarnpkg/libzip 3.2.2 is npm-signed and matches Yarn's release commit, but
# was published without provenance; mise's no-downgrade policy otherwise rejects Renovate.
"npm:renovate" = { version = "44.75.1", trust_policy_excludes = ["@yarnpkg/libzip@3.2.2"] }
rumdl = "v0.2.69"
shellcheck = "v0.11.0"
shfmt = "3.14.1"
taplo = "0.10.0"
typos = "1.50.1"

[env]
FLINT_CONFIG_DIR = ".github/config"

[tasks.build]
description = "Build the Java project"
run = "./gradlew build"

[tasks.lint]
description = "Run all lints"
run = "flint run"

[tasks."lint:fix"]
description = "Auto-fix lint issues"
run = "flint run --fix"
